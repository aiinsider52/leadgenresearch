# Render.com blueprint — web app + managed Postgres (persistent data).
# Dashboard: New + → Blueprint → connect repo → Apply.
databases:
  - name: leadgen-db
    plan: free
    databaseName: leadgen
    user: leadgen
    region: frankfurt

services:
  - type: web
    name: leadgenresearch
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: leadgen-db
          property: connectionString
      # Set in Render dashboard (never commit secrets):
      # OPENAI_API_KEY, APIFY_TOKEN, BRAVE_SEARCH_API_KEY, LEADGEN_API_KEY
