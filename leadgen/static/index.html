<!doctype html>
<html lang="uk" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeadGen</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    fontFamily: { sans:['Inter','ui-sans-serif','system-ui'], display:['"Space Grotesk"','Inter','sans-serif'] },
    colors: { brand:{50:'#eef2ff',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca'} },
    keyframes: {
      fadeup:{'0%':{opacity:0,transform:'translateY(8px)'},'100%':{opacity:1,transform:'translateY(0)'}},
      shimmer:{'100%':{transform:'translateX(100%)'}},
    },
    animation: { fadeup:'fadeup .35s cubic-bezier(.2,.7,.3,1) both' },
  }}
}
</script>
<style>
  :root{ color-scheme: dark; }
  html.dark{ color-scheme: dark; } html:not(.dark){ color-scheme: light; }
  body{ font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.font-display{ font-family:'Space Grotesk','Inter',sans-serif; }

  /* Ambient gradient backdrop */
  .aurora{ position:fixed; inset:0; z-index:-1; overflow:hidden; }
  .aurora::before, .aurora::after{ content:''; position:absolute; border-radius:9999px; filter:blur(90px); opacity:.5; }
  html.dark .aurora::before{ width:480px;height:480px; top:-120px; left:-80px; background:radial-gradient(circle,#6366f1,transparent 70%); }
  html.dark .aurora::after{ width:520px;height:520px; bottom:-160px; right:-100px; background:radial-gradient(circle,#10b981,transparent 70%); opacity:.35; }
  html:not(.dark) .aurora::before{ width:480px;height:480px; top:-160px; left:-60px; background:radial-gradient(circle,#c7d2fe,transparent 70%); }

  /* Glass surface */
  .glass{ background:rgba(255,255,255,.72); border:1px solid rgba(15,23,42,.08); backdrop-filter:blur(14px); }
  html.dark .glass{ background:rgba(24,24,27,.62); border:1px solid rgba(255,255,255,.07); }

  .card{ transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s, border-color .2s; }
  .card:hover{ transform:translateY(-3px); box-shadow:0 24px 48px -24px rgba(79,70,229,.45); border-color:rgba(99,102,241,.4); }

  input,select,button{ transition:all .18s ease; }
  *:focus-visible{ outline:2px solid #6366f1; outline-offset:2px; border-radius:.5rem; }

  #map{ height:300px; border-radius:1rem; z-index:0; }
  html.dark .leaflet-tile{ filter:none; }

  .spin{ width:18px;height:18px;border:2px solid rgba(99,102,241,.25);border-top-color:#6366f1;border-radius:50%;animation:sp .7s linear infinite;display:inline-block; }
  @keyframes sp{ to{transform:rotate(360deg)} }
  .skel{ position:relative; overflow:hidden; background:rgba(120,120,135,.12); }
  .skel::after{ content:''; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent); animation:shimmer 1.4s infinite; }
  @keyframes shimmer{ 100%{transform:translateX(100%)} }

  summary{ list-style:none; cursor:pointer; }
  summary::-webkit-details-marker{ display:none; }
  details>div{ animation:fadeup .2s ease both; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important; } }
  ::-webkit-scrollbar{ width:10px;height:10px } ::-webkit-scrollbar-thumb{ background:rgba(120,120,135,.35);border-radius:9999px }
</style>
</head>
<body class="min-h-screen bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 selection:bg-brand-500/30">
<div class="aurora"></div>

<!-- ░░ Header ░░ -->
<header class="sticky top-0 z-30 glass border-b border-black/5 dark:border-white/5">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-violet-500 grid place-items-center shadow-lg shadow-brand-500/30 shrink-0">
        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 2-3 7h6l-3 7"/><circle cx="12" cy="20" r="1.4"/></svg>
      </div>
      <div class="min-w-0">
        <div class="font-display font-bold tracking-tight leading-none" id="title">LeadGen</div>
        <div class="text-[11px] text-zinc-500 dark:text-zinc-400 truncate">geo leads · n8n automations</div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <nav class="flex bg-black/5 dark:bg-white/5 rounded-xl p-1 text-sm">
        <button data-tab="search" class="tabbtn px-3 py-1.5 rounded-lg font-medium flex items-center gap-1.5"><span class="ic" data-ic="search"></span><span data-i="tab_search">Пошук</span></button>
        <button data-tab="saved" class="tabbtn px-3 py-1.5 rounded-lg font-medium flex items-center gap-1.5"><span class="ic" data-ic="heart"></span><span data-i="tab_saved">Збережені</span><span id="savedCount" class="text-xs opacity-60"></span></button>
      </nav>
      <span id="aiPill" class="hidden sm:flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-medium border"></span>
      <button id="exportBtn" class="hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-xl border border-black/10 dark:border-white/10 bg-white dark:bg-zinc-900 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-sm font-medium" title="CSV"><span class="ic" data-ic="download"></span><span data-i="export">Експорт CSV</span></button>
      <select id="lang" class="bg-white dark:bg-zinc-900 border border-black/10 dark:border-white/10 rounded-xl px-2.5 py-2 text-sm font-medium cursor-pointer">
        <option value="uk">🇺🇦 UA</option><option value="ru">RU</option><option value="en">EN</option>
      </select>
      <button id="theme" class="w-10 h-10 grid place-items-center rounded-xl border border-black/10 dark:border-white/10 bg-white dark:bg-zinc-900 hover:bg-zinc-100 dark:hover:bg-zinc-800" title="Theme">
        <span class="ic" data-ic="moon"></span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 grid lg:grid-cols-[330px_1fr] gap-5">

  <!-- ░░ Sidebar ░░ -->
  <aside class="space-y-4 lg:sticky lg:top-[84px] lg:self-start">
    <!-- Search panel -->
    <div class="glass rounded-2xl p-5 space-y-3.5">
      <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
        <span class="ic" data-ic="search"></span><span data-i="search">Пошук</span>
      </div>
      <div>
        <label class="block text-xs mb-1 text-zinc-500 dark:text-zinc-400" data-i="category">Категорія</label>
        <input id="category" list="cats" class="w-full bg-white dark:bg-zinc-900/70 border border-black/10 dark:border-white/10 rounded-xl px-3 py-2.5 text-sm" value="restaurant" placeholder="restaurant / ресторан">
        <datalist id="cats"></datalist>
      </div>
      <div>
        <label class="block text-xs mb-1 text-zinc-500 dark:text-zinc-400" data-i="city">Місто</label>
        <input id="city" class="w-full bg-white dark:bg-zinc-900/70 border border-black/10 dark:border-white/10 rounded-xl px-3 py-2.5 text-sm" value="Львів">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="block text-xs mb-1 text-zinc-500 dark:text-zinc-400" data-i="country">Країна</label>
          <input id="country" class="w-full bg-white dark:bg-zinc-900/70 border border-black/10 dark:border-white/10 rounded-xl px-3 py-2.5 text-sm" value="Ukraine"></div>
        <div><label class="block text-xs mb-1 text-zinc-500 dark:text-zinc-400" data-i="limit">Кількість</label>
          <input id="limit" type="number" min="1" max="60" class="w-full bg-white dark:bg-zinc-900/70 border border-black/10 dark:border-white/10 rounded-xl px-3 py-2.5 text-sm" value="15"></div>
      </div>
      <label class="flex items-center gap-2.5 text-sm cursor-pointer select-none">
        <input type="checkbox" id="enrich" checked class="peer sr-only">
        <span class="w-9 h-5 rounded-full bg-zinc-300 dark:bg-zinc-700 peer-checked:bg-brand-500 relative after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-4 after:h-4 after:bg-white after:rounded-full after:transition peer-checked:after:translate-x-4"></span>
        <span data-i="enrich" class="text-zinc-600 dark:text-zinc-300">Збагачувати контакти</span>
      </label>
      <div>
        <label class="block text-xs mb-1 text-zinc-500 dark:text-zinc-400" data-i="source">Джерело</label>
        <select id="source" class="w-full bg-white dark:bg-zinc-900/70 border border-black/10 dark:border-white/10 rounded-xl px-3 py-2.5 text-sm cursor-pointer">
          <option value="osm">OpenStreetMap — швидко, безкоштовно</option>
          <option value="gmaps">Google Maps — рейтинги, відгуки, сайти</option>
        </select>
      </div>
      <button id="runCity" class="w-full bg-gradient-to-r from-brand-600 to-violet-600 hover:from-brand-500 hover:to-violet-500 text-white rounded-xl px-4 py-3 font-semibold shadow-lg shadow-brand-600/25 flex items-center justify-center gap-2">
        <span class="ic" data-ic="search"></span><span data-i="run">Знайти лідів</span>
      </button>
    </div>

    <!-- Map panel -->
    <div class="glass rounded-2xl p-5 space-y-3">
      <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
        <span class="ic" data-ic="pin"></span><span data-i="map_title">Пошук на карті</span>
      </div>
      <p class="text-xs text-zinc-500 dark:text-zinc-400" data-i="map_hint">Клікніть на карті, щоб обрати точку.</p>
      <div id="map"></div>
      <div class="flex items-center gap-3">
        <input id="radius" type="range" min="500" max="8000" step="500" value="2000" class="flex-1 accent-emerald-500">
        <span id="radiusLabel" class="text-xs font-medium text-zinc-500 dark:text-zinc-400 w-14 text-right tabular-nums">2.0 km</span>
      </div>
      <button id="runMap" disabled class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-xl px-4 py-3 font-semibold shadow-lg shadow-emerald-600/25 flex items-center justify-center gap-2">
        <span class="ic" data-ic="pin"></span><span data-i="search_here">Шукати тут</span>
      </button>
    </div>
  </aside>

  <!-- ░░ Results column ░░ -->
  <section class="min-w-0">
    <!-- Filter bar -->
    <div class="flex flex-wrap items-center gap-2 mb-4">
      <span class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mr-1 flex items-center gap-1.5"><span class="ic" data-ic="filter"></span><span data-i="filters">Фільтри</span></span>
      <button class="filterchip" data-f="email"  data-ic="mail"   data-i="f_email">email</button>
      <button class="filterchip" data-f="phone"  data-ic="phone"  data-i="f_phone">телефон</button>
      <button class="filterchip" data-f="linkedin" data-ic="link" data-i="f_linkedin">LinkedIn</button>
      <button class="filterchip" data-f="telegram" data-ic="send" data-i="f_telegram">Telegram</button>
      <button class="filterchip" data-f="dm"     data-ic="user"   data-i="f_dm">керівник</button>
      <select id="sort" class="ml-auto bg-white dark:bg-zinc-900 border border-black/10 dark:border-white/10 rounded-lg px-2.5 py-1.5 text-xs font-medium cursor-pointer">
        <option value="score" data-i="sort_score">За рейтингом ліда</option>
        <option value="reviews" data-i="sort_reviews">За відгуками</option>
        <option value="default" data-i="sort_default">За замовчуванням</option>
      </select>
      <span id="status" class="flex items-center gap-2 text-sm text-zinc-500 dark:text-zinc-400 min-h-[24px]"></span>
    </div>
    <div id="results" class="grid sm:grid-cols-2 xl:grid-cols-2 2xl:grid-cols-3 gap-4"></div>
  </section>
</main>

<!-- ░░ Outreach drawer ░░ -->
<div id="drawer" class="fixed inset-0 z-50 hidden">
  <div id="drawerBg" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
  <aside class="absolute right-0 top-0 h-full w-full max-w-lg bg-zinc-50 dark:bg-zinc-950 border-l border-black/10 dark:border-white/10 overflow-y-auto shadow-2xl">
    <header class="sticky top-0 glass border-b border-black/5 dark:border-white/5 px-5 py-4 flex items-center justify-between z-10">
      <div class="min-w-0">
        <div class="font-display font-bold truncate" id="dwName">—</div>
        <div class="text-xs text-zinc-500 dark:text-zinc-400 truncate" id="dwSub"></div>
      </div>
      <button id="dwClose" class="w-9 h-9 grid place-items-center rounded-xl border border-black/10 dark:border-white/10 hover:bg-zinc-100 dark:hover:bg-zinc-800"><span class="ic" data-ic="close"></span></button>
    </header>
    <div class="p-5 space-y-5">
      <!-- analysis -->
      <section>
        <div class="flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wider text-zinc-400 mb-2">${''}<span class="ic text-violet-400" data-ic="bolt"></span><span data-i="analysis">Аналіз компанії</span></div>
        <div id="dwAnalysis" class="text-sm whitespace-pre-wrap rounded-xl bg-black/[.03] dark:bg-white/[.04] border border-black/5 dark:border-white/5 p-3 text-zinc-700 dark:text-zinc-200 min-h-[60px]"></div>
      </section>
      <!-- message -->
      <section>
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wider text-zinc-400"><span class="ic text-violet-400" data-ic="pen"></span><span data-i="message">Повідомлення</span></div>
          <select id="dwPerson" class="text-xs bg-white dark:bg-zinc-900 border border-black/10 dark:border-white/10 rounded-lg px-2 py-1"></select>
        </div>
        <div class="flex gap-1 mb-2" id="dwChannels">
          <button data-ch="email" class="chtab flex-1 py-1.5 rounded-lg text-xs font-medium border">Email</button>
          <button data-ch="linkedin" class="chtab flex-1 py-1.5 rounded-lg text-xs font-medium border">LinkedIn</button>
          <button data-ch="telegram" class="chtab flex-1 py-1.5 rounded-lg text-xs font-medium border">Telegram</button>
        </div>
        <textarea id="dwMsg" rows="9" class="w-full bg-white dark:bg-zinc-900/70 border border-black/10 dark:border-white/10 rounded-xl px-3 py-2.5 text-sm resize-y" placeholder=""></textarea>
        <div class="flex gap-2 mt-2">
          <button id="dwGen" class="flex-1 bg-gradient-to-r from-brand-600 to-violet-600 hover:from-brand-500 hover:to-violet-500 text-white rounded-xl px-4 py-2.5 text-sm font-semibold flex items-center justify-center gap-2"><span class="ic" data-ic="bolt"></span><span data-i="regen">Згенерувати ще раз</span></button>
          <button id="dwCopy" class="px-4 py-2.5 rounded-xl border border-black/10 dark:border-white/10 bg-white dark:bg-zinc-900 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-sm font-medium flex items-center gap-1.5"><span class="ic" data-ic="copy"></span><span data-i="copy">Копіювати</span></button>
        </div>
      </section>
    </div>
  </aside>
</div>

<script>
// ---- SVG icon set (Lucide-style, stroke=currentColor) ----
const ICONS={
 search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
 heart:'<path d="M19 14c1.5-1.5 3-3.3 3-5.5A4.5 4.5 0 0 0 12 6 4.5 4.5 0 0 0 2 8.5C2 10.7 3.5 12.5 5 14l7 7Z"/>',

 mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
 phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/>',

 filter:'<path d="M22 3H2l8 9.5V20l4 2v-9.5L22 3Z"/>',

 ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',

};
function svg(name,cls='w-4 h-4'){return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;}
document.querySelectorAll('[data-ic]').forEach(el=>el.innerHTML=svg(el.dataset.ic, el.classList.contains('ic')?'w-4 h-4':'w-5 h-5'));

// ---- i18n ----

// ---- filters ----
function paintChips(){$$('.filterchip').forEach(c=>{const on=filters[c.dataset.f];
 c.className='filterchip inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border cursor-pointer '+
  (on?'bg-brand-500 text-white border-brand-500 shadow-sm shadow-brand-500/30':'bg-white/60 dark:bg-white/5 text-zinc-600 dark:text-zinc-300 border-black/10 dark:border-white/10 hover:border-brand-400');});}

function leadPasses(l){const en=l.enrichment||{},s=en.socials||{};
 if(filters.email&&!(en.emails||[]).length)return false;
 if(filters.phone&&!(en.phones||[]).length)return false;
 if(filters.linkedin&&!s.linkedin)return false;
 if(filters.telegram&&!(en.telegram||[]).length)return false;
 if(filters.dm&&!(en.decision_makers||[]).length)return false;
 return true;}

function renderCurrent(){const base=tab==='saved'?savedLeads:lastLeads;let vis=base.filter(leadPasses);
 if(sortMode==='score')vis=[...vis].sort((a,b)=>((b.score||{}).score||0)-((a.score||{}).score||0));
 else if(sortMode==='reviews')vis=[...vis].sort((a,b)=>((b.company||{}).reviews||0)-((a.company||{}).reviews||0));
 render(vis,base.length);}

   (p.employees||sizeBand)?chip(svg('user','w-3 h-3')+(p.employees?esc(p.employees)+' '+u.emp:esc(sizeBand)),sizeC||'bg-black/5 dark:bg-white/5 text-zinc-500'):'',
   sig.hiring?chip(svg('trend','w-3 h-3')+(sig.open_positions?sig.open_positions+' ':'' )+(lang==='en'?'hiring':lang==='ru'?'наём':'наймає'),'bg-emerald-500/15 text-emerald-500'):'',
   p.founded?chip(esc(u.founded)+' '+esc(p.founded),'bg-black/5 dark:bg-white/5 text-zinc-500'):'',
   (en.staff||[]).length?chip(svg('user','w-3 h-3')+(en.staff.length)+' '+esc(u.staff.toLowerCase()),'bg-black/5 dark:bg-white/5 text-zinc-500'):'',
 ].filter(Boolean).join('');
 const templates=(l.templates||[]).slice(0,4).map(t=>`
   <a href="${esc(t.url)}" target="_blank" rel="noopener" class="block rounded-xl bg-violet-500/[.06] dark:bg-violet-500/10 border border-violet-500/15 p-2.5 hover:border-violet-400 group">
     <div class="flex items-start justify-between gap-2"><b class="text-sm text-violet-700 dark:text-violet-300 leading-snug group-hover:text-violet-500">${esc(t.name)}</b>${svg('ext','w-3.5 h-3.5 text-violet-400 shrink-0 mt-0.5')}</div>
     <div class="text-[11px] text-zinc-500 dark:text-zinc-400 mt-1 truncate">${(t.nodes||[]).slice(0,4).map(esc).join(' · ')}</div></a>`).join('');
 const liked=l._saved;
 const sc=l.score||{}; const tierC={hot:'bg-rose-500',warm:'bg-amber-500',cold:'bg-zinc-400 dark:bg-zinc-600'}[sc.tier]||'bg-zinc-400';
 const tierLabel={hot:{uk:'гарячий',ru:'горячий',en:'hot'},warm:{uk:'теплий',ru:'тёплый',en:'warm'},cold:{uk:'холодний',ru:'холодный',en:'cold'}}[sc.tier]?.[lang]||'';
 const scoreBadge=sc.score!=null?`<div class="shrink-0 flex flex-col items-center justify-center w-12 h-12 rounded-xl ${tierC} text-white" title="${esc((sc.reasons||[]).join(', '))}"><span class="font-display font-bold text-base leading-none">${sc.score}</span><span class="text-[8px] uppercase tracking-wide opacity-90">${esc(tierLabel)}</span></div>`:'';
 return `<article class="card glass rounded-2xl p-5 animate-fadeup" data-id="${esc(l._id)}">

     </div>

   <div class="mt-3 space-y-1.5">
     ${emails.map(e=>`<a href="mailto:${esc(e)}" class="flex items-center gap-1.5 text-sm text-zinc-700 dark:text-zinc-200 hover:text-brand-500">${svg('mail','w-3.5 h-3.5 text-zinc-400')}<span class="truncate">${esc(e)}</span></a>`).join('')}
     ${phones.map(p=>`<div class="flex items-center gap-1.5 text-sm">${svg('phone','w-3.5 h-3.5 text-zinc-400')}<span>${esc(p)}</span></div>`).join('')}

   <div class="flex flex-wrap items-center gap-1.5 mt-2.5">
     ${socials}${tg}

function render(leads,total){const u=UI[lang],out=$('#results');
 if(tab==='saved'&&!savedLeads.length){out.innerHTML=emptyState(u.empty_saved);return;}
 if(!leads.length){out.innerHTML=emptyState(u.none);}
 else out.innerHTML=leads.map(card).join('');
 out.querySelectorAll('.card').forEach(el=>{
   el.querySelector('.heart').onclick=()=>toggleSave(el.dataset.id);
   const mb=el.querySelector('.msg'); if(mb)mb.onclick=()=>openOutreach(el.dataset.id);
 });
 if(tab==='search'&&lastLeads.length)$('#status').textContent=u.found(leads.length,lastLeads.length);
}
function emptyState(msg){return `<div class="col-span-full flex flex-col items-center justify-center text-center py-16 text-zinc-400">
 <div class="w-14 h-14 rounded-2xl bg-black/5 dark:bg-white/5 grid place-items-center mb-3">${svg('empty','w-7 h-7')}</div>
 <p class="text-sm">${esc(msg)}</p></div>`;}
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---- save ----
async function toggleSave(id){const pool=tab==='saved'?savedLeads:lastLeads;const lead=pool.find(l=>l._id===id);if(!lead)return;
 if(lead._saved){await fetch('/api/unsave',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});}
 else{await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lead})});}
 const v=!lead._saved;[...lastLeads,...savedLeads].filter(l=>l._id===id).forEach(l=>l._saved=v);
 if(tab==='saved'){savedLeads=savedLeads.filter(l=>l._saved);renderCurrent();} else renderCurrent();
 refreshSavedCount();}
async function loadSaved(){savedLeads=await (await fetch('/api/saved')).json();renderCurrent();}
async function refreshSavedCount(){const d=await (await fetch('/api/saved')).json();$('#savedCount').textContent=d.length?d.length:'';}

// ---- search ----
function loadingCards(){$('#results').innerHTML=Array.from({length:4}).map(()=>`<div class="glass rounded-2xl p-5 space-y-3"><div class="skel h-5 w-2/3 rounded-md"></div><div class="skel h-3 w-1/2 rounded"></div><div class="skel h-3 w-3/4 rounded"></div><div class="skel h-14 w-full rounded-xl"></div></div>`).join('');}
async function runSearch(url,body){const u=UI[lang];tab='search';paintTabs();
 $('#status').innerHTML=`<span class="spin"></span>${u.loading}`;loadingCards();
 try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await r.json();
  if(!r.ok){throw new Error(data&&data.error?data.error:'HTTP '+r.status);}
  lastLeads=data;renderCurrent();
 }catch(e){$('#status').innerHTML=`<span class="text-rose-500">⚠ ${esc(e.message||e)}</span>`;$('#results').innerHTML='';}}
$('#runCity').onclick=()=>runSearch('/api/find',{category:category.value,city:city.value,country:country.value,limit:+limit.value,lang,enrich:enrich.checked,source:$('#source').value});
$('#runMap').onclick=()=>picked&&runSearch('/api/find_around',{category:category.value,lat:picked.lat,lon:picked.lng,radius_m:+radius.value,limit:+limit.value,lang,enrich:enrich.checked});

// ---- outreach drawer ----
let dwLead=null, dwChannel='email', dwPersonIdx=0;
function findLead(id){return (tab==='saved'?savedLeads:lastLeads).find(l=>l._id===id)||savedLeads.find(l=>l._id===id)||lastLeads.find(l=>l._id===id);}
function paintChannels(){$$('#dwChannels .chtab').forEach(b=>{const on=b.dataset.ch===dwChannel;
  b.className='chtab flex-1 py-1.5 rounded-lg text-xs font-medium border '+(on?'bg-brand-500 text-white border-brand-500':'bg-white dark:bg-white/5 text-zinc-600 dark:text-zinc-300 border-black/10 dark:border-white/10 hover:border-brand-400');});}
function openOutreach(id){const u=UI[lang];dwLead=findLead(id);if(!dwLead)return;
  const c=dwLead.company||{},dms=(dwLead.enrichment||{}).decision_makers||[];
  $('#dwName').textContent=c.name||'';$('#dwSub').textContent=(c.gmaps_category||c.category||'')+' · '+(c.city||'');
  dwChannel='email';dwPersonIdx=0;paintChannels();
  const ps=$('#dwPerson');
  ps.innerHTML=dms.length?dms.map((p,i)=>`<option value="${i}">${esc(p.name)} · ${esc(p.role||'')}</option>`).join(''):`<option value="0">${esc(u.contact)}</option>`;
  $('#drawer').classList.remove('hidden');document.body.style.overflow='hidden';
  $('#dwAnalysis').innerHTML='<span class="spin"></span>';$('#dwMsg').value='';
  runAnalysis();genMessage();}
function closeDrawer(){$('#drawer').classList.add('hidden');document.body.style.overflow='';}
$('#dwClose').onclick=closeDrawer;$('#drawerBg').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
$$('#dwChannels .chtab').forEach(b=>b.onclick=()=>{dwChannel=b.dataset.ch;paintChannels();genMessage();});
$('#dwPerson').onchange=e=>{dwPersonIdx=+e.target.value;genMessage();};
async function runAnalysis(){const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lead:dwLead,lang})});
  const d=await r.json();$('#dwAnalysis').textContent=d.summary||'';}
async function genMessage(){$('#dwMsg').value='…';
  const r=await fetch('/api/outreach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lead:dwLead,person_index:dwPersonIdx,channel:dwChannel,lang})});
  const d=await r.json();$('#dwMsg').value=d.message||'';}
$('#dwGen').onclick=genMessage;
$('#dwCopy').onclick=()=>{const u=UI[lang];navigator.clipboard.writeText($('#dwMsg').value);const b=$('#dwCopy').querySelector('span:last-child');const o=b.textContent;b.textContent=u.copied;setTimeout(()=>b.textContent=o,1500);};

$('#exportBtn').onclick=()=>window.open('/api/export.csv?scope='+(tab==='saved'?'saved':'recent'),'_blank');
async function refreshAi(){const u=UI[lang];try{const d=await (await fetch('/api/ai_status')).json();const p=$('#aiPill');
  p.textContent=(d.ai?'🟢 ':'⚪ ')+(d.ai?u.ai_on:u.ai_off);
  p.className='hidden sm:flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-medium border '+(d.ai?'border-emerald-500/30 text-emerald-500 bg-emerald-500/10':'border-black/10 dark:border-white/10 text-zinc-400');}catch(e){}}

const lightTiles='https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
const map=L.map('map',{zoomControl:true,attributionControl:false}).setView([49.842,24.0316],12);
tiles=L.tileLayer(document.documentElement.classList.contains('dark')?darkTiles:lightTiles,{maxZoom:19}).addTo(map);
$('#radius').oninput=e=>{$('#radiusLabel').textContent=(e.target.value/1000).toFixed(1)+' km';if(circle)circle.setRadius(+e.target.value);};
map.on('click',e=>{picked=e.latlng;
 if(marker)marker.setLatLng(e.latlng);else marker=L.marker(e.latlng).addTo(map);
 if(circle)circle.setLatLng(e.latlng).setRadius(+radius.value);else circle=L.circle(e.latlng,{radius:+radius.value,color:'#10b981',weight:1.5,fillColor:'#10b981',fillOpacity:.12}).addTo(map);
 $('#runMap').disabled=false;});

// ---- init ----
(async function(){
 setTheme((localStorage.getItem('lg_theme')||'dark')==='dark');
 const cats=await (await fetch('/api/categories')).json();
 $('#cats').innerHTML=cats.map(c=>`<option value="${c}">`).join('');
 paintChips();refreshSavedCount();applyLang();
 setTimeout(()=>map.invalidateSize(),200);
})();
</script>
</body></html>
